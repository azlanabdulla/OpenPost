<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="opBaseGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A1D" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <linearGradient id="opPrimaryGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F65FF" />
      <stop offset="100%" stop-color="#2F45FF" />
    </linearGradient>
    <linearGradient id="opAccentGrad" x1="200" y1="180" x2="350" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#8C9AFF" />
    </linearGradient>
    <filter id="opSubtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2F45FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#opBaseGrad)" stroke="#2A2A2E" stroke-width="6"/>
  
  <!-- Outer Editorial Grid Frame (Subtle) -->
  <rect x="72" y="72" width="368" height="368" rx="72" stroke="#25252A" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Left Request Bracket Chevron -->
  <path d="M192 168L104 256L192 344" stroke="url(#opPrimaryGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#opSubtleGlow)"/>

  <!-- Right Response Bracket Chevron -->
  <path d="M320 168L408 256L320 344" stroke="url(#opPrimaryGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#opSubtleGlow)"/>

  <!-- Central Intersecting Payload Node & Geometric Flow -->
  <path d="M224 256H288" stroke="url(#opAccentGrad)" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Central Aperture Rings -->
  <circle cx="256" cy="204" r="16" fill="#8C9AFF" />
  <circle cx="256" cy="308" r="16" fill="#4F65FF" />
  
  <!-- Vertical Data Bus -->
  <path d="M256 160V188" stroke="#8C9AFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 4"/>
  <path d="M256 324V352" stroke="#4F65FF" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="opGrad1" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="opGrad2" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <filter id="opGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hexagonal / Shield Base with modern facets -->
  <rect x="12" y="12" width="96" height="96" rx="24" fill="#0B132B" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Origami Chevron & Wings representing an Open Local Packet -->
  <path d="M28 42L60 66L92 42" stroke="url(#opGrad1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#opGlow)"/>
  <path d="M28 42V78L60 96L92 78V42" stroke="#1E293B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner Terminal Chevron '>' Pulse -->
  <path d="M46 54L60 66L74 54" stroke="url(#opGrad2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="60" cy="78" r="4.5" fill="#22D3EE" filter="url(#opGlow)"/>
</svg>

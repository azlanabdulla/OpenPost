name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.platform-name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform-name: 'Windows x64'
            os: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform-name: 'macOS Apple Silicon'
            os: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform-name: 'macOS Intel'
            os: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
          - platform-name: 'Linux x64'
            os: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Production Assets
        run: npm run build

      - name: Build Desktop Application via Tauri
        run: npx tauri build --target ${{ matrix.target }}

      - name: Package Artifacts and Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_assets
          Get-ChildItem -Recurse src-tauri/target/ | Where-Object { $_.FullName -like "*release*bundle*" -and $_.Extension -in '.msi','.exe' } | ForEach-Object {
            Copy-Item $_.FullName release_assets/
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "release_assets/$($_.Name).sha256" -Value "$hash  $($_.Name)"
          }

      - name: Package Artifacts and Checksums (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release_assets
          find src-tauri/target/ -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} release_assets/ \;
          cd release_assets
          for f in *; do
            if [ -f "$f" ] && [ "${f##*.}" != "sha256" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" > "$f.sha256"
              else
                shasum -a 256 "$f" > "$f.sha256"
              fi
            fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openpost-${{ matrix.target }}
          path: release_assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release_assets/*
          draft: false
          prerelease: true
          generate_release_notes: true

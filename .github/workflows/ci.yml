name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run WCAG Contrast Audit
        run: node scripts/verify_contrast.cjs

      - name: Build Frontend Bundle
        run: npm run build

  rust-windows:
    name: Rust Backend Checks (Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Frontend Dist Stub
        run: |
          New-Item -ItemType Directory -Force dist
          Set-Content -Path dist/index.html -Value "<!DOCTYPE html><html><body></body></html>"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Verify Rust Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --test history_unit_tests

  rust-linux:
    name: Rust Backend Checks (Ubuntu Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Prepare Frontend Dist Stub
        run: |
          mkdir -p dist
          echo "<!DOCTYPE html><html><body></body></html>" > dist/index.html

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Verify Rust Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --test history_unit_tests

[package]
name = "openpost"
version = "0.1.0"
description = "The free, open-source Postman alternative"
authors = ["OpenPost Contributors"]
license = "MIT"
repository = "https://github.com/azlanabdulla/OpenPost"
homepage = "https://github.com/azlanabdulla/OpenPost"
edition = "2021"
default-run = "openpost"

[lib]
name = "openpost_lib"
crate-type = ["rlib"]
test = false

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "cookies", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
